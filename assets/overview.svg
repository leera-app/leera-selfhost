<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Leera self-hosted: one command installs the whole stack on your server</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Leera self-hosted</text>
  <text x="40" y="80" font-size="15" fill="#475569">One command. Your server. Automatic HTTPS.</text>

  <!-- Steps -->
  <g font-size="14">
    <rect x="40" y="108" width="260" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="68" cy="146" r="14" fill="#6366f1"/>
    <text x="68" y="151" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
    <text x="92" y="140" font-weight="600" fill="#0f172a">Linux server</text>
    <text x="92" y="162" fill="#475569">2 GB RAM, 25 GB disk</text>

    <rect x="350" y="108" width="260" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="378" cy="146" r="14" fill="#6366f1"/>
    <text x="378" y="151" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
    <text x="402" y="140" font-weight="600" fill="#0f172a">Run install.sh</text>
    <text x="402" y="162" fill="#475569" font-family="SFMono-Regular, Menlo, monospace" font-size="13">curl ... | bash</text>

    <rect x="660" y="108" width="260" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="688" cy="146" r="14" fill="#6366f1"/>
    <text x="688" y="151" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
    <text x="712" y="140" font-weight="600" fill="#0f172a">Open your domain</text>
    <text x="712" y="162" fill="#475569">First sign-up is admin</text>
  </g>
  <line x1="304" y1="146" x2="344" y2="146" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="614" y1="146" x2="654" y2="146" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stack -->
  <rect x="40" y="212" width="880" height="176" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="240" font-size="13" font-weight="600" fill="#4338ca">INSTALLED IN ~/leera</text>

  <g font-size="14">
    <rect x="60" y="262" width="190" height="48" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="155" y="283" text-anchor="middle" font-weight="600" fill="#0f172a">Caddy</text>
    <text x="155" y="301" text-anchor="middle" font-size="12" fill="#475569">ports 80, 443 + HTTPS</text>

    <rect x="320" y="262" width="150" height="48" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="395" y="283" text-anchor="middle" font-weight="600" fill="#0f172a">Web app</text>
    <text x="395" y="301" text-anchor="middle" font-size="12" fill="#475569">Next.js</text>

    <rect x="320" y="322" width="150" height="48" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="395" y="343" text-anchor="middle" font-weight="600" fill="#0f172a">API</text>
    <text x="395" y="361" text-anchor="middle" font-size="12" fill="#475569">Rust</text>

    <rect x="540" y="262" width="170" height="48" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="625" y="283" text-anchor="middle" font-weight="600" fill="#0f172a">PostgreSQL 17</text>
    <text x="625" y="301" text-anchor="middle" font-size="12" fill="#475569">database</text>

    <rect x="540" y="322" width="170" height="48" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="625" y="343" text-anchor="middle" font-weight="600" fill="#0f172a">SeaweedFS</text>
    <text x="625" y="361" text-anchor="middle" font-size="12" fill="#475569">file storage</text>

    <rect x="760" y="262" width="140" height="48" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-dasharray="5 4"/>
    <text x="830" y="283" text-anchor="middle" font-weight="600" fill="#0f172a">Mail server</text>
    <text x="830" y="301" text-anchor="middle" font-size="12" fill="#475569">optional, port 25</text>
  </g>
  <g stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="250" y1="286" x2="314" y2="286"/>
    <path d="M270 286 V346 H314"/>
    <line x1="470" y1="346" x2="534" y2="292"/>
    <line x1="470" y1="346" x2="534" y2="346"/>
  </g>
</svg>
